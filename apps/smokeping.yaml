schema: 2
id: smokeping
name: SmokePing
category: network
description:
  de: "Misst Latenz und Paketverlust zu Zielen im Netz."
  en: "Measures latency and packet loss to network targets."
web: {port: 80, public_port: 8284}
services:
  app:
    image: ghcr.io/linuxserver/smokeping:version-2.9.0-r0
    volumes:
      - {container: /config, appdata: config}
      - {container: /data, appdata: data}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
