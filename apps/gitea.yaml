schema: 2
id: gitea
name: Gitea
category: development
description:
  de: "Git-Server mit Issues, Pull Requests und CI."
  en: "Git server with issues, pull requests and CI."
website: https://about.gitea.com/
notes:
  de: "Git über SSH auf Port 2222."
  en: "Git over SSH on port 2222."
web: {port: 3000, public_port: 3016}
services:
  app:
    image: gitea/gitea:28.3.0
    depends_on: [db]
    lan_ports:
      - {container: 22, host: 2222, protocol: tcp}
    volumes:
      - {container: /data, appdata: data}
    environment:
      USER_UID: "{PUID}"
      USER_GID: "{PGID}"
      GITEA__database__DB_TYPE: "postgres"
      GITEA__database__HOST: "db:5432"
      GITEA__database__NAME: "gitea"
      GITEA__database__USER: "gitea"
      GITEA__database__PASSWD: "{SECRET_DB}"
      GITEA__server__SSH_PORT: "2222"
  db:
    image: postgres:17.11-alpine
    volumes:
      - {container: /var/lib/postgresql/data, appdata: db}
    environment:
      POSTGRES_DB: "gitea"
      POSTGRES_USER: "gitea"
      POSTGRES_PASSWORD: "{SECRET_DB}"
