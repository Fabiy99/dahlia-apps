schema: 2
id: homepage
name: Homepage
category: tools
description:
  de: "Startseite mit Links und Widgets für die eigenen Dienste."
  en: "Start page with links and widgets for your services."
website: https://gethomepage.dev/
web: {port: 3000, public_port: 3015}
services:
  app:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    volumes:
      - {container: /app/config, appdata: config}
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      PUID: "{PUID}"
      PGID: "{PGID}"
