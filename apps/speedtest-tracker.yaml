schema: 2
id: speedtest-tracker
name: Speedtest Tracker
category: network
description:
  de: "Misst regelmäßig die Internetgeschwindigkeit."
  en: "Measures your internet speed regularly."
notes:
  de: "Standard-Login admin@example.com / password, sofort ändern."
  en: "Default login admin@example.com / password, change it right away."
web: {port: 80, public_port: 8765}
services:
  app:
    image: ghcr.io/linuxserver/speedtest-tracker:version-v1.15.1
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
      APP_KEY: "{SECRET_KEY}"
      DB_CONNECTION: "sqlite"
      SPEEDTEST_SCHEDULE: "0 */6 * * *"
      APP_URL: "https://speedtest-tracker.{DOMAIN}"
