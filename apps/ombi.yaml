schema: 2
id: ombi
name: Ombi
category: media
description:
  de: "Wunschliste für Plex, Emby und Jellyfin."
  en: "Request manager for Plex, Emby and Jellyfin."
web: {port: 3579, public_port: 3579}
services:
  app:
    image: ghcr.io/linuxserver/ombi:version-v4.53.10
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
