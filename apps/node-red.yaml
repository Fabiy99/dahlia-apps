schema: 2
id: node-red
name: Node-RED
category: home
description:
  de: "Abläufe und Automationen grafisch verbinden."
  en: "Wire up flows and automations graphically."
web: {port: 1880, public_port: 1880}
services:
  app:
    image: nodered/node-red:5.0.9
    user: "{PUID}:{PGID}"
    volumes:
      - {container: /data, appdata: data}
    environment:
      TZ: "{TZ}"
