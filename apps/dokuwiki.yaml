schema: 2
id: dokuwiki
name: DokuWiki
category: productivity
description:
  de: "Wiki ohne Datenbank, Seiten als Textdateien."
  en: "Wiki without a database, pages stored as text files."
notes:
  de: "Einrichtung unter /install.php."
  en: "Setup at /install.php."
web: {port: 80, public_port: 8319}
services:
  app:
    image: ghcr.io/linuxserver/dokuwiki:version-2026-07-14
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
