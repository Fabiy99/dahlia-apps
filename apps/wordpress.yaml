schema: 2
id: wordpress
name: WordPress
category: productivity
description:
  de: "Website und Blog mit Themes und Plugins."
  en: "Website and blog with themes and plugins."
website: https://wordpress.org/
notes:
  de: "Die Adresse beim ersten Aufruf wird die Website-Adresse; am besten https://wordpress.<Domain>."
  en: "The address used on the first visit becomes the site address; best use https://wordpress.<domain>."
web: {port: 80, public_port: 8325}
services:
  app:
    image: wordpress:6.9.4-php8.3-apache
    depends_on: [db]
    volumes:
      - {container: /var/www/html, appdata: html}
    environment:
      WORDPRESS_DB_HOST: "db"
      WORDPRESS_DB_USER: "wordpress"
      WORDPRESS_DB_PASSWORD: "{SECRET_DB}"
      WORDPRESS_DB_NAME: "wordpress"
  db:
    image: mariadb:11.8.9
    volumes:
      - {container: /var/lib/mysql, appdata: db}
    environment:
      MARIADB_DATABASE: "wordpress"
      MARIADB_USER: "wordpress"
      MARIADB_PASSWORD: "{SECRET_DB}"
      MARIADB_ROOT_PASSWORD: "{SECRET_DBROOT}"
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--innodb-use-native-aio=0", "--innodb-flush-method=fsync"]
