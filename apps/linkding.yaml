schema: 2
id: linkding
name: linkding
category: productivity
description:
  de: "Lesezeichen sammeln und durchsuchen."
  en: "Collect and search bookmarks."
web: {port: 9090, public_port: 9090}
login: {user: "admin", password: "{SECRET_ADMIN}"}
services:
  app:
    image: sissbruecker/linkding:1.47.0
    volumes:
      - {container: /etc/linkding/data, appdata: data}
    environment:
      LD_SUPERUSER_NAME: "admin"
      LD_SUPERUSER_PASSWORD: "{SECRET_ADMIN}"
