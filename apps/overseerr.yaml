schema: 2
id: overseerr
name: Overseerr
category: media
description:
  de: "Wunschliste für Filme und Serien für Plex."
  en: "Request manager for movies and shows for Plex."
web: {port: 5055, public_port: 5056}
services:
  app:
    image: ghcr.io/linuxserver/overseerr:version-v1.35.0
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
