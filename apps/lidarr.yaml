schema: 2
id: lidarr
name: Lidarr
category: downloads
description:
  de: "Verwaltet Musik und lädt neue Alben."
  en: "Manages music and fetches new albums."
web: {port: 8686, public_port: 8686}
services:
  app:
    image: ghcr.io/linuxserver/lidarr:version-3.1.6.5079
    volumes:
      - {container: /config, appdata: config}
      - {container: /music, share: music}
      - {container: /downloads, share: downloads}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
