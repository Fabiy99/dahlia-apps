schema: 2
id: komga
name: Komga
category: books
description:
  de: "Server für Comics und Mangas mit OPDS."
  en: "Server for comics and manga with OPDS."
website: https://komga.org/
web: {port: 25600, public_port: 25600}
services:
  app:
    image: gotson/komga:1.30.1
    user: "{PUID}:{PGID}"
    volumes:
      - {container: /config, appdata: config}
      - {container: /data, share: books}
    environment:
      TZ: "{TZ}"
