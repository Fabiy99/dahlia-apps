schema: 2
id: freshrss
name: FreshRSS
category: productivity
description:
  de: "RSS-Reader für Nachrichten und Blogs."
  en: "RSS reader for news and blogs."
web: {port: 80, public_port: 8281}
services:
  app:
    image: ghcr.io/linuxserver/freshrss:version-1.30.4
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
