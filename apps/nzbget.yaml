schema: 2
id: nzbget
name: NZBGet
category: downloads
description:
  de: "Schneller Usenet-Downloader."
  en: "Fast Usenet downloader."
web: {port: 6789, public_port: 6789}
login: {user: "admin", password: "{SECRET_ADMIN}"}
services:
  app:
    image: ghcr.io/linuxserver/nzbget:version-v26.3
    volumes:
      - {container: /config, appdata: config}
      - {container: /downloads, share: downloads}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
      NZBGET_USER: "admin"
      NZBGET_PASS: "{SECRET_ADMIN}"
