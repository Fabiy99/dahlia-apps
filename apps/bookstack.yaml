schema: 2
id: bookstack
name: BookStack
category: productivity
description:
  de: "Wiki und Dokumentation in Büchern und Kapiteln."
  en: "Wiki and documentation organised in books and chapters."
notes:
  de: "Standard-Login admin@admin.com / password, sofort ändern. Aufruf über https://bookstack.<Domain>."
  en: "Default login admin@admin.com / password, change it right away. Open it at https://bookstack.<domain>."
web: {port: 80, public_port: 6875}
services:
  app:
    image: ghcr.io/linuxserver/bookstack:version-v26.09.2
    depends_on: [db]
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
      APP_URL: "https://bookstack.{DOMAIN}"
      APP_KEY: "{SECRET_KEY}"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "bookstack"
      DB_USERNAME: "bookstack"
      DB_PASSWORD: "{SECRET_DB}"
  db:
    image: mariadb:11.8.9
    volumes:
      - {container: /var/lib/mysql, appdata: db}
    environment:
      MARIADB_DATABASE: "bookstack"
      MARIADB_USER: "bookstack"
      MARIADB_PASSWORD: "{SECRET_DB}"
      MARIADB_ROOT_PASSWORD: "{SECRET_DBROOT}"
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--innodb-use-native-aio=0", "--innodb-flush-method=fsync"]
