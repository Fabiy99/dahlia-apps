schema: 2
id: radarr
name: Radarr
category: downloads
description:
  de: "Verwaltet Filme und lädt sie herunter."
  en: "Manages movies and fetches them."
notes:
  de: "Bibliothek unter /media (Freigabe media), Downloads unter /downloads (Freigabe downloads)."
  en: "Library in /media (share media), downloads in /downloads (share downloads)."
web: {port: 7878, public_port: 7878}
services:
  app:
    image: ghcr.io/linuxserver/radarr:version-6.4.4.10685
    volumes:
      - {container: /config, appdata: config}
      - {container: /media, share: media}
      - {container: /downloads, share: downloads}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
