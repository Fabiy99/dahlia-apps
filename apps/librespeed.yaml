schema: 2
id: librespeed
name: LibreSpeed
category: network
description:
  de: "Geschwindigkeitstest für das eigene Netz."
  en: "Speed test for your own network."
web: {port: 80, public_port: 8285}
login: {password: "{SECRET_ADMIN}"}
services:
  app:
    image: ghcr.io/linuxserver/librespeed:version-v6.3.1
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
      PASSWORD: "{SECRET_ADMIN}"
