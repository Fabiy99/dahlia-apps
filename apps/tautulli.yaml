schema: 2
id: tautulli
name: Tautulli
category: media
description:
  de: "Statistiken und Überwachung für Plex."
  en: "Statistics and monitoring for Plex."
web: {port: 8181, public_port: 8181}
services:
  app:
    image: ghcr.io/linuxserver/tautulli:version-v2.18.2
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
