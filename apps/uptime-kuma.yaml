schema: 2
id: uptime-kuma
name: Uptime Kuma
category: monitoring
description:
  de: "Überwacht Webseiten und Dienste und meldet Ausfälle."
  en: "Monitors websites and services and reports outages."
website: https://uptime.kuma.pet/
web: {port: 3001, public_port: 3001}
services:
  app:
    image: louislam/uptime-kuma:2.5.11
    volumes:
      - {container: /app/data, appdata: data}
    environment:
      TZ: "{TZ}"
