schema: 2
id: filebrowser
name: File Browser
category: cloud
description:
  de: "Dateien der Freigaben im Browser verwalten, hoch- und herunterladen."
  en: "Manage the shares' files in the browser, upload and download."
website: https://filebrowser.org/
notes:
  de: "Das erste Passwort für admin steht im Log: sudo docker logs dahlia-filebrowser"
  en: "The first password for admin is in the log: sudo docker logs dahlia-filebrowser"
web: {port: 80, public_port: 8333}
services:
  app:
    image: filebrowser/filebrowser:v2.63.23
    user: "{PUID}:{PGID}"
    volumes:
      - {container: /database, appdata: database}
      - {container: /config, appdata: config}
      - {container: /srv/media, share: media}
      - {container: /srv/downloads, share: downloads}
      - {container: /srv/documents, share: documents}
    environment:
      TZ: "{TZ}"
