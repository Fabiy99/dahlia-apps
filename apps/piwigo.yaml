schema: 2
id: piwigo
name: Piwigo
category: photos
description:
  de: "Fotogalerie mit Alben und Rechten."
  en: "Photo gallery with albums and permissions."
notes:
  de: "Bei der Einrichtung als Datenbank-Host db, Benutzer piwigo und das Passwort aus den Zugangsdaten eintragen."
  en: "In the setup enter database host db, user piwigo and the password from the login."
web: {port: 80, public_port: 8092}
login: {user: "piwigo", password: "{SECRET_DB}"}
services:
  app:
    image: ghcr.io/linuxserver/piwigo:version-16.5.0
    depends_on: [db]
    volumes:
      - {container: /config, appdata: config}
      - {container: /gallery, appdata: gallery}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
  db:
    image: mariadb:11.8.9
    volumes:
      - {container: /var/lib/mysql, appdata: db}
    environment:
      MARIADB_DATABASE: "piwigo"
      MARIADB_USER: "piwigo"
      MARIADB_PASSWORD: "{SECRET_DB}"
      MARIADB_ROOT_PASSWORD: "{SECRET_DBROOT}"
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--innodb-use-native-aio=0", "--innodb-flush-method=fsync"]
