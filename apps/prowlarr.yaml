schema: 2
id: prowlarr
name: Prowlarr
category: downloads
description:
  de: "Indexer-Verwaltung für Sonarr, Radarr und Lidarr."
  en: "Indexer manager for Sonarr, Radarr and Lidarr."
web: {port: 9696, public_port: 9696}
services:
  app:
    image: ghcr.io/linuxserver/prowlarr:version-2.7.0.5723
    volumes:
      - {container: /config, appdata: config}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
