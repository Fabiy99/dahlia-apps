schema: 2
id: mylar3
name: Mylar3
category: downloads
description:
  de: "Verwaltet Comics und lädt neue Ausgaben."
  en: "Manages comics and fetches new issues."
web: {port: 8090, public_port: 8091}
services:
  app:
    image: ghcr.io/linuxserver/mylar3:version-v0.11.0
    volumes:
      - {container: /config, appdata: config}
      - {container: /comics, share: books}
      - {container: /downloads, share: downloads}
    environment:
      PUID: "{PUID}"
      PGID: "{PGID}"
      TZ: "{TZ}"
