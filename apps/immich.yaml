schema: 2
id: immich
name: Immich
category: photos
description:
  de: "Foto- und Video-Backup mit Apps, Gesichtserkennung und Suche. Fotos in der Freigabe photos."
  en: "Photo and video backup with apps, face recognition and search. Photos in the photos share."
website: https://immich.app/
notes:
  de: "Der erste Login legt das Admin-Konto an."
  en: "The first login creates the admin account."
web: {port: 2283, public_port: 2283}
services:
  app:
    image: ghcr.io/immich-app/immich-server:v2.7.5
    depends_on: [db, redis, ml]
    volumes:
      - {container: /data, share: photos}
    environment:
      DB_HOSTNAME: "db"
      DB_USERNAME: "immich"
      DB_PASSWORD: "{SECRET_DB}"
      DB_DATABASE_NAME: "immich"
      REDIS_HOSTNAME: "redis"
      IMMICH_MACHINE_LEARNING_URL: "http://ml:3003"
      TZ: "{TZ}"
  ml:
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5
    volumes:
      - {container: /cache, appdata: model-cache}
  redis:
    image: valkey/valkey:8.1.11-alpine
    volumes:
      - {container: /data, appdata: redis}
  db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    volumes:
      - {container: /var/lib/postgresql/data, appdata: db}
    environment:
      POSTGRES_USER: "immich"
      POSTGRES_PASSWORD: "{SECRET_DB}"
      POSTGRES_DB: "immich"
      POSTGRES_INITDB_ARGS: "--data-checksums"
